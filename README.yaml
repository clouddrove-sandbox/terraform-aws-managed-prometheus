#  description of this project
description: |-
  Terraform module to create an Amazon Managed Prometheus workspace on AWS along with its IAM role, SAML configuration, license association, API keys, service accounts and optional VPC security group.

# How to use this project
# yamllint disable rule:line-length
usage: |-
  Here are some examples of how you can use this module in your inventory structure:
  ### Basic Example
  ```hcl
      module "prometheus" {
        source = "../.."

        workspace_alias = "example-workspace"
        name            = "example-amp"
        environment     = "dev"

        tags = {
          Environment = "dev"
          Terraform   = "true"
          Project     = "example"
        }

        rule_group_namespaces = {
          example = {
            name = "example-rulegroup"
            data = <<-EOT
            groups:
              - name: example
                rules:
                  - record: job:http_inprogress_requests:sum
                    expr: sum by (job) (http_inprogress_requests)
            EOT
          }
        }
      }
  ```

  ### Complete Example
  ```hcl
      module "prometheus" {
        source = "../.."

        workspace_alias = "complete-example-workspace"
        name            = "complete-amp"
        environment     = "prod"

        logging_configuration = {
          create_log_group = true
        }

        retention_period_in_days = 60
        create_alert_manager     = true
        create_resource_policy   = true

        tags = {
          Environment = "prod"
          Terraform   = "true"
          Project     = "complete-example"
        }

        rule_group_namespaces = {
          example = {
            name = "example-rulegroup"
            data = <<-EOT
            groups:
              - name: example
                rules:
                  - record: job:http_inprogress_requests:sum
                    expr: sum by (job) (http_inprogress_requests)
            EOT
          }
        }
      }
  ```
